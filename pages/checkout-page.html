<!DOCTYPE html>

<html>
  <head> 
    <title>Checkout page</title>

    <link rel="stylesheet" href="styles/product-styles.css/header-downbar.css">

    <link rel="stylesheet" href="styles/checkout-page-styles.css/checkout-page.css">

  </head>
  
  <body>    
    <div class="header">
      <div>
        <img class="hamburger-menu" 
        src="images/svg/hamburger-menu.svg">
      </div>
      
      <div class="header-logo-section js-home-icon">
        <img class="crochet-logo-image" src="images/crochet-logo-transparent.png">
      
      <div class="morusyaki">
        MORUSYAKI
      </div>
      
      <div class="workshop ">
        CROCHET WORKSHOP
      </div>
      </div>
      
      <div class="header-right-section">
        <div class="js-home-icon">
          <img class="home-icon" 
          src="images/svg/home.svg">
        </div>
        
        <div class="js-workshop-button">
          <img class="workshop-icon" 
          src="images/crochet-logo-transparent.png">
        </div>

        <div class="js-basket-button">
          <img class="basket-black" 
          src="images/basket_black.png">
        </div>
      </div>
    </div>
    
    <div class="checkout-page-grid js-checkout-page">
      <div class="selected-products-section     js-selected-products-section"></div>
  
      <div class="payment-section"> 
        <div class="payment-container">
          <div class="delivery-section">
            <div class="delivery-option-section">
              <p class="delivery-option">Delivery option 1</p>
              <p class="delivery-option">Delivery option 2</p>
              <p class="delivery-option">Delivery option 3</p>
            </div>
          </div>
          
          <div class="place-your-order-button-position">
            <div class="place-your-order-button">
              Place your Order
            </div>
          </div>
        </div>
      </div>
    </div>  

    <div class="down-bar">
      <div class="js-home-icon">Home</div>
      <div class="js-shop-button">Shop</div>
      <div class="js-workshop-button">Workshop</div>
      <div>About us</div>
      <div class="js-contacts-button">Contacts</div>
    </div>

    <script type="module" src="scripts/checkout-page.js"></script>
  </body>
</html>
