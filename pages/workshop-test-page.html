<!DOCTYPE html>

<html>
  <head>
    <title>Workshop</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <link rel="stylesheet" href="main-page-styles.css/catalogue.css">
    <link rel="stylesheet" href="product-styles.css/product-downbar.css">
    <link rel="stylesheet" href="product-styles.css/header.css">

    <style>
      .process-description {
        width: 500px;
        height: 500px;
      }
      
      .workshop-main-grid {
        display: grid;
        grid-template-rows: 1fr 100px 50px 100px 50px 1fr 50px;
        row-gap: 10px;
        align-items: center;
        justify-content: center;
        height: 480px;
        width: 600px;
        margin-left: 5px;
      }

      .workshop-title {
        display: flex; 
        justify-content: center; 
        font-size: 32px;
        padding-bottom: 12px;
        margin: 0 20px;
        border-bottom: 2px solid black;
      }

      .pick-toy-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        height: 100px;
      }

      .pick-toy-icon {
        height: 100px;
        padding-left: 25px;
      }

      .pick-your-toy-button {
        width: 400px;
        font-size: 18px;
        padding: 4px 0;
        background-color: rgb(214, 247, 143);
        border: none;
        cursor: pointer;
        transition: 0.15;
        margin-bottom: 30px;
        border-radius: 4px;
      }

      .pick-your-toy-button:hover {
        color: white;
        background-color: rgb(181, 98, 91);
      }

      .thread-icon {
        height: 80px;
        padding-left: 2px;
        cursor: pointer;
      }

      .describe-your-toy-placeholder {
        width: 594px;
        height: 60px;
        text-align: center;
        font-size: 20px;
        border: 1px solid black;
      }

      .workshop-send-button {
        width: 600px;
        font-size: 18px;
        padding: 4px 0;
        background-color: rgb(0, 0, 0);
        color: white;
        border: none;
        cursor: pointer;
        transition: 0.15;
      }

      .workshop-send-button:hover {
        color: white;
        background-color: rgb(181, 98, 91);
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div>
        <i class="fa fa-youtube-play" style="font-size:36px"></i>
      </div>
      <div>
        <i class="fa fa-facebook" style="font-size:36px"></i>
      </div>
      <div>
        <i class="fa fa-instagram" style="font-size:36px"></i>
      </div>
      <img class="crochet-logo-image" src="images/crochet-logo-transparent.png">
      <div class="morusyaki">
          MORUSYAKI
      </div>
      <div class="workshop">
          CROCHET WORKSHOP
      </div>
      <div>
          <img class="home-icon" src="images/svg/home.svg">
      </div>
      <div>
          <img class="basket-black" 
          src="images/basket_black.png">
      </div>
      <div>
          <img class="hamburger-menu" 
          src="images/svg/hamburger-menu.svg">
      </div>
    </header>
    
    <div class="main-page-grid">
      <div class="process-description">
        Hi!
      </div>
      <div class="workshop-main-grid">
        <div class="workshop-title">
          Workshop
        </div>
        <div class="pick-toy-grid">
          <img class="pick-toy-icon" src="images/dimensions-icon.png">
          <img class="pick-toy-icon" src="images/dimensions-icon.png">
          <img class="pick-toy-icon" src="images/dimensions-icon.png">
          <img class="pick-toy-icon" src="images/dimensions-icon.png">
        </div>
        <div style="display: flex; justify-content: center;">
          <button class="pick-your-toy-button">
            Pick your toy
          </button>
        </div>
        <div class="pick-main-color">
          <img class="thread-icon" src="images/threads/beige_thread.png">
          <img class="thread-icon" src="images/threads/yellow_thread.png">
          <img class="thread-icon" src="images/threads/pink_thread.png">
          <img class="thread-icon" src="images/threads/salad_green_thread.png">
          <img class="thread-icon" src="images/threads/sky_blu_thread.png">
          <img class="thread-icon" src="images/threads/purple_thread.png">
          <img class="thread-icon" src="images/threads/brown_thread.png">
        </div>
        <div style="display: flex; justify-content: center;">
          <button class="pick-your-toy-button">
            Pick color
          </button>
        </div>
        <div>
          <input class="describe-your-toy-placeholder" placeholder="Describe your toy by your own words">
        </div>
        <div style="display: flex; flex: 1; 
          align-items: center; 
          justify-content: center;">
          <button class="workshop-send-button">
            Send
          </button>
        </div>
      </div>
    </div>
    <div class="down-bar">
      <div>Home</div>
      <div>Shop</div>
      <div>Workshop</div>
      <div>About us</div>
      <div>Contacts</div>
    </div>
  </body>
</html>
