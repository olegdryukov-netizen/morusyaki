<!DOCTYPE html>

<html>
  <head>
    <title>Contacts</title>

    <link rel="stylesheet" href="styles/contacts-css.css/contacts-total.css">

    <link rel="stylesheet" href="styles/product-styles.css/header-downbar.css">

    <link rel="stylesheet" href="styles/main-page-styles.css/main-page.css">
  </head>

  <body>
    <div class="main-page-grid">
      <div class="main-page-icons-sidebar">
        <div class="js-basket-button">
          <img class="basket-black" 
          src="images/basket_black.png">
        </div>
        <div>
            <img class="hamburger-menu" 
            src="images/svg/hamburger-menu.svg">
        </div>
      </div>
      
      <div class="main-page-logo-section">
        <div class="js-home-icon">
          <img class="main-page-logo" src="images/main_logo.png">
        </div>
  
        <div class="main-page-buttons-section">
          <div class="workshop-button-section">
            <button class="workshop-button js-workshop-button">
              WORKSHOP
            </button>
          </div>
          
          <div class="shop-button-section">
            <button class="shop-button js-shop-button">
              SHOP
            </button>
          </div>
        </div>
      </div>

      <div class="contacts-main-grid">
        <div class="contacts-title-position">
          <p class="contacts-title">
            Contacts
          </p>
        </div>

        <div class="name-email-input">
          <input class="placeholder-name" placeholder="Name">
        </div>

        <div class="name-email-input">
          <input class="placeholder-name" placeholder="e-mail">
        </div>

        <div class="placeholder-message-position">
          <input class="placeholder-your-message" placeholder="Your message">
        </div>

        <div class="contacts-send-button-position">
          <button class="contacts-send-button">
            Send
          </button>
        </div>
      </div>
    </div>
  
    <script type="module" src="scripts/contacts-page.js"></script>

  </body>
</html>
