<!DOCTYPE html>

<html>
  <head>
    <title>Contacts</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <link rel="stylesheet" href="main-page-styles.css/catalogue.css">
    <link rel="stylesheet" href="main-page-styles.css/general-css.css">
    <link rel="stylesheet" href="contacts-css.css/contacts-total.css">


  </head>
  <body>
    <div>
        <img class="basket-black" 
        src="images/basket_black.png">
    </div>
    <div>
        <img class="hamburger-menu" 
        src="images/svg/hamburger-menu.svg">
    </div>
    <div>
      <i class="fa fa-youtube-play" style="font-size:36px"></i>
    </div>
    <div>
      <i class="fa fa-facebook" style="font-size:36px"></i>
    </div>
    <div>
      <i class="fa fa-instagram" style="font-size:36px"></i>
    </div>
    
    <div class="main-page-grid">
      <div>
        <img style="width: 500px; 
          padding-right: 100px;"
          src="images/main_logo.png">
      </div>
      <div class="contacts-main-grid">
        <div class="contacts-title">
          Contacts
        </div>
        <div class="name-email-input">
          <div>
            <input class="placeholder-name" placeholder="Name">
          </div>
          <div>
            <input class="placeholder-name" placeholder="e-mail">
          </div>
        </div>
        <div>
          <input class="placeholder-your-message" placeholder="Your message">
        </div>
        <div style="display: flex; flex: 1; 
          align-items: center; 
          justify-content: center;">
          <button class="contacts-send-button">
            Send
          </button>
        </div>
      </div>
    </div>
    <div class="down-bar">
      <div>Home</div>
      <div>Shop</div>
      <div>Workshop</div>
      <div>About us</div>
      <div>Contacts</div>
    </div>
  </body>
</html>
