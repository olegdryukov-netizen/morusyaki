<!DOCTYPE html>

<html>
  <head>
    <title>Shop page</title>

    <link rel="stylesheet" href="styles/product-styles.css/header-downbar.css">

    <link rel="stylesheet" href="styles/shop-page-styles.css/shop-page-description.css">
  </head>

  <body>
    <div class="header">
      <div>
        <img class="hamburger-menu" 
        src="images/svg/hamburger-menu.svg">
      </div>
      
      <div class="header-logo-section js-home-icon">
        <img class="crochet-logo-image" src="images/crochet-logo-transparent.png">
      
      <div class="morusyaki">
        MORUSYAKI
      </div>
      
      <div class="workshop ">
        CROCHET WORKSHOP
      </div>
      </div>
      
      <div class="header-right-section">
        <div class="js-home-icon">
          <img class="home-icon" 
          src="images/svg/home.svg">
        </div>
        
        <div class="js-workshop-button">
          <img class="workshop-icon" 
          src="images/crochet-logo-transparent.png">
        </div>

        <div class="js-basket-button">
          <img class="basket-black" 
          src="images/basket_black.png">
        </div>
      </div>
    </div>

    <div class="main">
      <div class="products-grid js-shop-page-html">
      </div>
    </div>

    <div class="down-bar">
      <div class="js-home-icon">Home</div>
      <div class="js-shop-button">Shop</div>
      <div class="js-workshop-button">Workshop</div>
      <div>About us</div>
      <div class="js-contacts-button">Contacts</div>
    </div>

    <script type="module" src="scripts/shop-page.js"></script>
    <script src="scripts/main-page.js"></script>
  </body>
</html>
